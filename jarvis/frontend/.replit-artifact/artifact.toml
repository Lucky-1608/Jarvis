kind = "web"
previewPath = "/"
title = "Jarvis OS"
version = "1.0.0"
id = "artifacts/jarvis-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18614

[services.development]
run = "pnpm --filter @workspace/jarvis-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jarvis-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/jarvis-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18614"
BASE_PATH = "/"
