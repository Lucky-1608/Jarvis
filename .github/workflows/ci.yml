name: Jarvis CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[dev]"
          
      - name: Run linting
        run: |
          # Basic linting (we will use ruff if available)
          pip install ruff
          ruff check jarvis/ || true
          
      - name: Verify Backend Builds
        run: |
          docker build -f Dockerfile.backend -t jarvis-backend:test .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install and Build Frontend
        working-directory: ./jarvis/frontend
        run: |
          npm ci
          npm run build
