version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - JARVIS_API_KEY=JARVIS_DEV_KEY
    volumes:
      - .:/app
    # Use restart: always in production
    restart: unless-stopped

  frontend:
    build:
      context: ./jarvis/frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
